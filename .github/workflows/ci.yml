name: Validate Regulars
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Require complete runtime coverage
        run: npm run test:coverage
      - name: Exercise PostgreSQL adapter and application flows
        run: npm run test:postgres
